<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juned - Weather Dashboard</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <div class="container">
    <h1 class="Weather">Weather Dashboard</h1>
    <form>
      <input type="search" id="search-items" name="city_search" placeholder="Enter city name...">
      <button type="submit" class="btn-search" id="search-btn">search</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <div id="current-weather"></div>
    <div id="forecast"></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
